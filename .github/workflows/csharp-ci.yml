name: C# TsFile CI/CD

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'csharp/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './csharp/Apache.TsFile.slnx'
  PROJECT_PATH: './csharp/src/Apache.TsFile/Apache.TsFile.csproj'
  TEST_PATH: './csharp/tests/Apache.TsFile.Tests/Apache.TsFile.Tests.csproj'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Display .NET version
        run: dotnet --version
      
      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet restore ${{ env.TEST_PATH }}
      
      - name: Build library
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
      
      - name: Build tests
        run: dotnet build ${{ env.TEST_PATH }} --configuration Release --no-restore
      
      - name: Run unit tests
        run: dotnet test ${{ env.TEST_PATH }} --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/test-results.trx'
      
      - name: Run example
        working-directory: ./csharp/examples/BasicExample
        run: |
          dotnet build --configuration Release
          dotnet run --configuration Release --no-build

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet restore ${{ env.TEST_PATH }}
      
      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
      
      - name: Run code analysis
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore /p:AnalysisLevel=latest /p:TreatWarningsAsErrors=false

  integration-tests-java-interop:
    name: Java Interoperability Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build Java TSFile (install parent POM first)
        run: |
          mvn install -DskipTests -Dmaven.javadoc.skip=true -N
          cd java
          mvn clean install -DskipTests -Dmaven.javadoc.skip=true
      
      - name: Build C# TSFile
        run: |
          dotnet build ${{ env.PROJECT_PATH }} --configuration Release
          dotnet build ./csharp/examples/BasicExample/BasicExample.csproj --configuration Release
      
      # Test 1: Java creates V4 file, C# reads it
      - name: Test Java -> C# Interop (Java writes V4, C# reads)
        run: |
          echo "=== Test 1: Java creates V4 file, C# reads ===" 
          
          # Java writes a V4 file using TsFileWriteSimple
          cd java/examples
          mvn exec:java -Dexec.mainClass="org.apache.tsfile.TsFileWriteSimple" -Dexec.args="../java-interop-test.tsfile"
          ls -la ../java-interop-test.tsfile
          
          # C# reads the Java V4 file
          cd ../../csharp
          dotnet run --project ./examples/BasicExample/BasicExample.csproj --configuration Release --no-build -- read ../java-interop-test.tsfile
          echo "Java -> C# Interop test passed!"
      
      # Test 2: C# self-interop (write and read back)
      # Note: C# writes V3 format, Java reads V4 natively. Full C#->Java interop 
      # requires C# V3 format to match Java V3 exactly or C# to write V4 format.
      - name: Test C# Self-Interop
        working-directory: ./csharp
        run: |
          echo "=== Test 2: C# self-interop ==="
          dotnet run --project ./examples/BasicExample/BasicExample.csproj --configuration Release --no-build -- write ../csharp-self-test.tsfile
          dotnet run --project ./examples/BasicExample/BasicExample.csproj --configuration Release --no-build -- read ../csharp-self-test.tsfile
          echo "C# self-interop test passed!"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore ${{ env.TEST_PATH }}
      
      - name: Run tests with coverage
        run: dotnet test ${{ env.TEST_PATH }} --configuration Release --collect:"XPlat Code Coverage" --results-directory ./coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/**/coverage.cobertura.xml
          flags: csharp
          name: csharp-coverage
          fail_ci_if_error: false

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet restore ./csharp/benchmarks/Apache.TsFile.Benchmarks/Apache.TsFile.Benchmarks.csproj
      
      - name: Build library
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
      
      - name: Build benchmark tool
        run: dotnet build ./csharp/benchmarks/Apache.TsFile.Benchmarks/Apache.TsFile.Benchmarks.csproj --configuration Release --no-restore
      
      - name: Run benchmark (medium dataset)
        working-directory: ./csharp/benchmarks/Apache.TsFile.Benchmarks
        run: |
          echo "=== Performance Benchmark (Medium Dataset) ==="
          echo "Running with 100 tables × 100 devices × 100 measurements × 1000 rows × 10 tablets"
          dotnet run --configuration Release -- --tables 100 --devices 100 --measurements 100 --rows 1000 --tablets 10 --iterations 10 --warmup 1
          
          echo ""
          echo "Benchmark completed successfully"
          echo "For full benchmark results (100M data points), run locally with default parameters"

  package:
    name: Create NuGet Package
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet restore ${{ env.TEST_PATH }}
      
      - name: Build library
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
      
      - name: Pack NuGet package
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./packages /p:PackageVersion=1.0.0-alpha.${{ github.run_number }}
      
      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg

  publish-nuget:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./packages/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: false  # Disabled until ready for production release

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: |
          dotnet restore ${{ env.PROJECT_PATH }}
          dotnet restore ${{ env.TEST_PATH }}
      
      - name: Run security scan
        run: |
          dotnet list ${{ env.PROJECT_PATH }} package --vulnerable --include-transitive 2>&1 | tee security-scan.log
          if grep -q "has the following vulnerable packages" security-scan.log; then
            echo "::warning::Vulnerable packages detected"
            exit 0  # Don't fail build, just warn
          fi
      
      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: security-scan.log

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, integration-tests-java-interop]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true
        continue-on-error: true
      
      - name: Validate and publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: C# Test Results
          path: '**/*.trx'
          reporter: dotnet-trx
          fail-on-error: false
        continue-on-error: true
